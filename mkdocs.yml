site_name: Portfolio | BSc Inženjerski Projekti
site_description: Pregled tehničkih i inženjerskih projekata sa Bachelor studija.
site_author: Emir

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Preklopi na tamni režim
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Preklopi na svijetli režim
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Početna: index.md
  - Mikroreže & BESS: projekti/microgrids.md
  - PLC & Automatizacija: projekti/plc-automation.md
  - Obrada Signala & Python: projekti/dsp-python.md
  - Kontakt & CV: kontakt.md
