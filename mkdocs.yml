site_name: Portfolio | BSc Engineering Projects
site_description: Overview of technical and engineering projects from Bachelor studies.
site_author: Emir Krdžalić
site_url: https://ekrdzo.github.io/portfolio/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/back-to-top.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Microgrid & Power Electronics: projekti/microgrids.md
  - PLC & Automation: projekti/plc-automation.md
  - Signal Processing & Simulation: projekti/obrada-signala.md
  - Embedded & FPGA: projekti/embedded-fpga.md
  - Mechatronics & Robotics: projekti/mehatronika.md
  - Contact & CV: kontakt.md
