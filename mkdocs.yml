site_name: Portfolio | BSc Inženjerski Projekti
site_description: Pregled tehničkih i inženjerskih projekata sa Bachelor studija.
site_author: Emir
site_url: https://ekrdzo.github.io/portfolio/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Preklopi na tamni režim
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Preklopi na svijetli režim
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Početna: index.md
  - Mikroreže & BESS: projekti/microgrids.md
  - PLC & Automatizacija: projekti/plc-automation.md
  - Obrada Signala & Simulacije: projekti/obrada-signala.md
  - Ugrađeni Sistemi & FPGA: projekti/embedded-fpga.md
  - Mehatronika & Robotika: projekti/mehatronika.md
  - Kontakt & CV: kontakt.md
